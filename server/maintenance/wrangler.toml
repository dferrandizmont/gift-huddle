name = "gift-huddle-retention-maintenance"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = []

[dev]
ip = "127.0.0.1"
port = 8791

[observability]
enabled = false

# External classes: no migrations, new namespaces, routes or scheduled triggers.
# Jurisdiction is selected explicitly on both namespaces in worker.ts.
[[durable_objects.bindings]]
name = "LISTS_V2"
class_name = "ListV2Object"
script_name = "gift-huddle-sync"

[[durable_objects.bindings]]
name = "RECOVERIES_V2"
class_name = "RecoveryLocatorObject"
script_name = "gift-huddle-sync"
